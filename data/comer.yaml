# Brackets mark the irregular part of a form. Persons: yo, tú, él, nosotros, vosotros, ellos.
inf: comer
gloss: to eat
tipo: regular
uso:
  - ["eat", "Como tortillas.", "I eat tortillas."]
  - ["meal", "Comemos a la una.", "We eat at one."]
  - ["eat up", "Se comió todo.", "He ate it all."]
  - ["eat out", "Comemos afuera.", "We're eating out."]
  - ["nails", "Me como las uñas.", "I bite my nails."]
  - ["capture", "Me comí tu reina.", "I took your queen."]
gerundio: comiendo
participio: comido
forms:
  presente: ["como", "comes", "come", "comemos", "coméis", "comen"]
  indefinido: ["comí", "comiste", "comió", "comimos", "comisteis", "comieron"]
  imperfecto: ["comía", "comías", "comía", "comíamos", "comíais", "comían"]
  futuro: ["comeré", "comerás", "comerá", "comeremos", "comeréis", "comerán"]
  condicional: ["comería", "comerías", "comería", "comeríamos", "comeríais", "comerían"]
  imperativo: [null, "come", "coma", "comamos", "comed", "coman"]
  imperativo-negativo: [null, "no comas", "no coma", "no comamos", "no comáis", "no coman"]
  subjuntivo: ["coma", "comas", "coma", "comamos", "comáis", "coman"]
  subjuntivo-imperfecto: ["comiera", "comieras", "comiera", "comiéramos", "comierais", "comieran"]
  perfecto: ["he comido", "has comido", "ha comido", "hemos comido", "habéis comido", "han comido"]
  pluscuamperfecto: ["había comido", "habías comido", "había comido", "habíamos comido", "habíais comido", "habían comido"]
expresiones:
  - ["comer afuera", "to eat out"]
  - ["darle de comer a", "to feed"]
  - ["comer de todo", "to eat everything"]
  - ["¿Qué hay de comer?", "What's to eat?"]
  - ["comer como coche", "to eat like a pig"]
  - ["comer como pajarito", "to eat like a bird"]
