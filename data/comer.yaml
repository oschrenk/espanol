examples:
  presente: "*Como* frijoles casi todos los días."
  indefinido: "Ayer *comí* pepián en Xela."
  imperfecto: "De niño *comía* mucho mango."
  futuro: "Mañana *comeremos* con mi suegra."
  condicional: "Yo no *comería* eso."
  imperativo: "*Come* más tortillas, mijo."
  subjuntivo: "Quiero que *comas* algo antes."
  subjuntivo-imperfecto: "Si *comieras* mejor, no te enfermarías."
  perfecto: "¿Alguna vez *has comido* chuchitos?"
  pluscuamperfecto: "Nunca *había comido* tamales negros."
  gerundio: "*Estamos comiendo* en el carro."
  participio: "Ya *he comido*, gracias."
translations:
  presente: I eat beans almost every day.
  indefinido: Yesterday I ate pepián in Xela.
  imperfecto: As a child I ate a lot of mango.
  futuro: Tomorrow we'll eat with my mother-in-law.
  condicional: I wouldn't eat that.
  imperativo: Eat more tortillas, son.
  subjuntivo: I want you to eat something first.
  subjuntivo-imperfecto: If you ate better, you wouldn't get sick.
  perfecto: Have you ever eaten chuchitos?
  pluscuamperfecto: I had never eaten black tamales.
  gerundio: We're eating in the car.
  participio: I've already eaten, thanks.
